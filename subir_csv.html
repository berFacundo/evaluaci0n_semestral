<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="subir_csv.css">
    <title>Subir CSV</title>
</head>

<body>
    <form action="procesar_csv.php" method="post" enctype="multipart/form-data">
        <h1>Subir archivo CSV</h1>
        <input type="file" name="csv" accept=".csv"s required> <br><br>
        <select name="tipo" required>
            <option value="" selected>Seleccione el tipo de dato</option>
            <option value="temperatura">Temperatura</option>
            <option value="viento">Viento</option>
            <option value="humedad">Humedad</option>
            <option value="precipitacion">Precipitación</option>
        </select> <br><br>
        <button type="submit">Subir y procesar</button>
    </form>
</body>

</html>
